name: verify

# 검증 단계를 job 으로 나눈다.
#   tools     → 스크립트가 실제로 도는가 (검사기, HTML→PDF, 메타 제거)
#   dogfood   → 이 저장소의 문서를 자기 검사기로 검사
#   secrets   → 토큰·개인정보 잔존 검사

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    name: 1 도구 · 검사기와 변환기가 도는가
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pikepdf
      - name: 검사기가 위반을 잡고 종료 코드 1 을 내는가
        run: |
          printf '# 제목\n\n이것은 — 줄표다.\n' > /tmp/bad.md
          if python3 tools/ai-tell-check.py /tmp/bad.md; then echo "위반을 놓쳤습니다"; exit 1; fi
          echo "위반 검출 OK"
      - name: HTML → PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser poppler-utils >/dev/null 2>&1 || sudo apt-get install -y -qq chromium poppler-utils >/dev/null
          chmod +x tools/*.sh
          ./tools/html2pdf.sh examples/resume.html /tmp/resume.pdf
          pdfinfo /tmp/resume.pdf | grep -E "^Pages"
      - name: 메타데이터 제거
        run: |
          python3 tools/strip-meta.py /tmp/resume.pdf --author "CI" --title "test"
          pdfinfo /tmp/resume.pdf | grep -qE "^Producer" && { echo "Producer 가 남아 있습니다"; exit 1; } || echo "생성 도구 표식 없음"

  dogfood:
    name: 2 자기검사 · 문서에 AI 티가 없는가
    runs-on: ubuntu-latest
    needs: tools
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ai-tell-check.py README.md SKILL.md "references/*.md" "examples/*.html"

  secrets:
    name: 3 비밀 · 토큰과 개인정보 잔존
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          if grep -rnE "(sk-[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|[0-9]{3}-[0-9]{3,4}-[0-9]{4})" --exclude-dir=.git .; then
            echo "비밀값 또는 연락처 패턴이 남아 있습니다."; exit 1
          fi
          echo "없음"
